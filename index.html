<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO META TAGS -->
    <title>Nightora - Platform Streaming Video HD Terlengkap</title>
    <meta name="description" content="Nightora menyediakan layanan streaming video kualitas HD dengan update harian, daftar artist terlengkap, dan navigasi mudah.">
    <meta name="keywords" content="Nightora, streaming video, nonton online, video hd, artist list, genre video, movie list">
    <meta name="author" content="Nightora">
    <meta property="og:title" content="Nightora - Streaming Video HD">
    <meta property="og:description" content="Update harian video terbaru dengan kualitas terbaik di Nightora.">
    <meta property="og:image" content="https://nightora.github.io/logo.png">

    <!-- ICONS & FONTS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS ASLI NIGHTORA ANDA */
        html,body,div,span,applet,object,iframe,h1,h2,h3,h4,h5,h6,p,blockquote,pre,a,abbr,acronym,address,big,cite,code,del,dfn,em,img,ins,kbd,q,s,samp,small,strike,strong,sub,sup,tt,var,b,u,i,center,dl,dt,dd,ol,ul,li,fieldset,form,label,legend,table,caption,tbody,tfoot,thead,tr,th,td,article,aside,canvas,details,embed,figure,figcaption,footer,header,hgroup,menu,nav,output,ruby,section,summary,time,mark,audio,video{margin:0;padding:0;border:0;font-size:100%;vertical-align:baseline;direction:ltr}article,aside,details,figcaption,figure,footer,header,hgroup,menu,nav,section{display:block}*,::before,::after{box-sizing:border-box}html{height:100%}body{line-height:1}ol,ul{list-style:none}a{color:#fbb829;text-decoration:none;transition:color .1s linear}a:hover{text-decoration:none;color:#FFF}p{margin:10px 0}body{color:#b8b8b8;font-size:15px;background:#0e0e0e;font-family:'Fira Sans',sans-serif;margin:0 auto;padding:0;overflow-y:auto!important;position:relative;min-height:100%;padding-bottom:100px}#content{margin:30px auto;padding:0 15px;max-width:1370px}
        #main-menu{position:relative;margin:0;background:#090909;height:88px;width:100%;box-shadow:0 14px 27px #16181e;z-index:999}#main-menu .centernav{margin:0 auto;max-width:1370px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;height:100%}#main-menu .logo{font-size:28px;font-weight:800;color:#fbb829;font-style:italic;cursor:pointer}#main-menu ul{display:flex;list-style:none}#main-menu ul li{margin:0 10px}#main-menu ul li a{line-height:88px;color:#bbb;font-weight:500;text-transform:uppercase;font-size:13px}
        .searchx{position:relative;width:300px;background:rgb(255 255 255 / .1);border-radius:22.5px;padding-left:40px}.searchx input{background:none;border:none;height:40px;width:100%;color:#fff;outline:none}.searchx i{position:absolute;left:15px;top:12px;color:#bbb}
        .latest .los{overflow:hidden;margin:0 -5px;display:flex;flex-wrap:wrap}.latest .los .box{width:12.5%;float:left;padding:5px}
        .bx{background:#1c1c1c;border-radius:5px;overflow:hidden;transition:0.3s;cursor:pointer;position:relative}
        .limit{position:relative;padding-bottom:140%;overflow:hidden}.limit img{position:absolute;width:100%;height:100%;object-fit:cover;transition:0.5s}
        .overlay .quality{position:absolute;top:8px;right:8px;background:#f8f9fa;color:#212529;font-size:11px;padding:3px 6px;font-weight:700;border-radius:3px;z-index:2}
        .addinfox{padding:12px;height:75px}.addinfox h2{font-size:13px;color:#fff;line-height:19px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
        .bx:hover .limit img{transform:scale(1.1)}.bx:hover{box-shadow:0 0 15px #fbb829}
        .nsfw-toggle{background:#222;border:1px solid #444;color:#fbb829;padding:8px 20px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:700;margin-left:15px}.nsfw-toggle.active{background:#fbb829;color:#000}
        .load-more{text-align:center;margin:40px 0}.btn-load{background:#fbb829;color:#000;padding:12px 35px;border-radius:5px;font-weight:700;cursor:pointer;border:none;text-transform:uppercase}
        #listView{display:none}.list-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));gap:15px}
        .list-item{background:#1c1c1c;padding:20px;border-radius:5px;border:1px solid #333;text-align:center;cursor:pointer;font-weight:700;color:#fbb829;text-transform:uppercase}.list-item:hover{background:#fbb829;color:#000}
        .playerx{background:#000;margin-bottom:20px}.player-embed{position:relative;padding-bottom:56.25%;height:0;overflow:hidden}.player-embed iframe{position:absolute;top:0;left:0;width:100%;height:100%}
        .infodb .entry-content .data li i{padding:2px 8px;background:#fbb829;color:#252525;font-weight:700;font-size:11px;border-radius:2px;font-style:normal;margin-right:5px;cursor:pointer;display:inline-block;margin-bottom:5px}
        
        /* RESPONSIVE MOBILE */
        @media (max-width:1024px){.latest .los .box{width:20%}}
        @media (max-width:768px){#main-menu{height:auto;padding:15px 0}.centernav{flex-direction:column;gap:15px}#main-menu ul{display:none}.searchx{width:100%}.latest .los .box{width:33.33%}}
        @media (max-width:480px){.latest .los .box{width:50%}.logo{font-size:22px}}
    </style>
</head>
<body>

<header id="main-menu">
    <div class="centernav">
        <div class="logo" onclick="goHome()">NIGHTORA</div>
        <ul>
            <li><a href="javascript:void(0)" onclick="goHome()">Home</a></li>
            <li><a href="javascript:void(0)" onclick="renderAZ()">A-Z List</a></li>
            <li><a href="javascript:void(0)" onclick="renderFilterPage('artists')">Artist</a></li>
            <li><a href="javascript:void(0)" onclick="renderFilterPage('genres')">Genre</a></li>
            <li><a href="javascript:void(0)" onclick="renderFilterPage('category')">Category</a></li>
        </ul>
        <div class="searchx">
            <i class="fa fa-search"></i>
            <input type="text" id="s" onkeyup="searchPosts()" placeholder="Cari kode atau judul...">
        </div>
        <button id="nsfwBtn" class="nsfw-toggle" onclick="toggleNSFW()">SFW MODE</button>
    </div>
</header>

<div id="content">
    <!-- HOME VIEW -->
    <div id="homeView">
        <!-- Popular Slider (Optional) -->
        <div class="latest" style="margin-bottom:40px;">
            <h2 id="popularTitle" style="color:#fff; font-size:18px; margin-bottom:15px; border-left:4px solid #fbb829; padding-left:10px;">POPULER</h2>
            <div id="popularGrid" class="los"></div>
        </div>

        <div class="latest">
            <h2 id="sectionTitle" style="color:#fff; font-size:18px; margin-bottom:15px; border-left:4px solid #fbb829; padding-left:10px;">UPDATE TERBARU</h2>
            <div id="videoGrid" class="los"></div>
        </div>
        <div class="load-more">
            <button id="loadMoreBtn" class="btn-load" onclick="loadMore()">Muat Lebih Banyak</button>
        </div>
    </div>

    <!-- LIST VIEW (Artist, Genre, AZ) -->
    <div id="listView">
        <h1 id="listTitle" style="color:#fff; font-size:22px; margin-bottom:25px; text-transform:uppercase;"></h1>
        <div id="listGrid" class="list-grid"></div>
    </div>

    <!-- DETAIL VIEW -->
    <div id="detailView" style="display:none;">
        <button onclick="goHome()" style="background:none; border:none; color:#fbb829; cursor:pointer; margin-bottom:25px; font-weight:700;"><i class="fa fa-arrow-left"></i> KEMBALI KE BERANDA</button>
        <div id="postContent"></div>
    </div>
</div>

<footer id="footer">
    <div class="centerfooter">
        <div class="bgc" style="padding:40px 0; text-align:center; border-top:1px solid #1c1c1c; margin-top:50px;">
            <p style="color:#fbb829; font-weight:700; font-size:18px; margin-bottom:10px;">NIGHTORA</p>
            <p style="font-size:12px; color:#555;">© 2024 Nightora Streaming Platform. Semua konten didapatkan dari sumber pihak ketiga.</p>
        </div>
    </div>
</footer>

<script src="posts.js"></script>
<script>
    let isNSFW = false;
    let limit = 16;
    const increment = 16;

    // 1. RENDER HOME & POPULAR
    function renderHome() {
        const data = videoData.filter(v => isNSFW ? true : !v.nsfw);
        
        // Render Popular (Sort by views)
        const popularGrid = document.getElementById('popularGrid');
        popularGrid.innerHTML = '';
        [...data].sort((a,b) => b.views - a.views).slice(0, 8).forEach(post => {
            popularGrid.innerHTML += createBox(post);
        });

        // Render Terbaru
        renderGrid(data);
    }

    function createBox(post) {
        return `
            <div class="box" onclick="loadPost('${post.id}')">
                <div class="bx">
                    <div class="limit">
                        <img src="${post.thumb}" alt="${post.title}">
                        <div class="overlay"><span class="quality">HD</span></div>
                    </div>
                    <div class="addinfox"><h2>${post.title}</h2></div>
                </div>
            </div>`;
    }

    function renderGrid(data) {
        const grid = document.getElementById('videoGrid');
        grid.innerHTML = '';
        const displayData = data.slice(0, limit);
        displayData.forEach(post => { grid.innerHTML += createBox(post); });
        document.getElementById('loadMoreBtn').style.display = limit >= data.length ? 'none' : 'block';
    }

    function loadMore() {
        limit += increment;
        renderHome();
    }

    // 2. LOAD DETAIL & RANDOM RECOMMENDED
    async function loadPost(postId) {
        document.getElementById('homeView').style.display = 'none';
        document.getElementById('listView').style.display = 'none';
        document.getElementById('detailView').style.display = 'block';
        const area = document.getElementById('postContent');
        area.innerHTML = '<p style="text-align:center; padding:50px;">Memuat Video...</p>';

        try {
            const res = await fetch(`content/${postId}.html`);
            const html = await res.text();
            
            // Generate Random Recommended
            const recs = videoData.filter(v => v.id !== postId).sort(() => 0.5 - Math.random()).slice(0, 6);
            let recHtml = `<div class="latest relat" style="margin-top:40px;"><h2 style="color:#fff; font-size:18px; margin-bottom:15px; border-left:4px solid #fbb829; padding-left:10px;">REKOMENDASI UNTUK ANDA</h2><div class="los">`;
            recs.forEach(r => { recHtml += createBox(r); });
            recHtml += `</div></div>`;

            area.innerHTML = html + recHtml;
            window.scrollTo(0,0);
        } catch (e) { area.innerHTML = '<p>Maaf, video tidak ditemukan.</p>'; }
    }

    // 3. AUTOMATIC LIST GENERATOR
    function renderFilterPage(type) {
        document.getElementById('homeView').style.display = 'none';
        document.getElementById('detailView').style.display = 'none';
        const listContainer = document.getElementById('listView');
        const listGrid = document.getElementById('listGrid');
        listContainer.style.display = 'block';
        document.getElementById('listTitle').innerText = `DAFTAR ${type}`;
        
        let items = [];
        videoData.forEach(v => {
            if (Array.isArray(v[type])) items.push(...v[type]);
            else if (v[type]) items.push(v[type]);
        });
        const uniqueItems = [...new Set(items)].sort();
        
        listGrid.innerHTML = '';
        uniqueItems.forEach(item => {
            listGrid.innerHTML += `<div class="list-item" onclick="filterBy('${type}', '${item}')">${item}</div>`;
        });
    }

    function filterBy(type, value) {
        const filtered = videoData.filter(v => Array.isArray(v[type]) ? v[type].includes(value) : v[type] === value);
        document.getElementById('listView').style.display = 'none';
        document.getElementById('homeView').style.display = 'block';
        document.getElementById('sectionTitle').innerText = `HASIL FILTER: ${value}`;
        document.getElementById('popularGrid').parentElement.style.display = 'none';
        limit = 100;
        renderGrid(filtered);
    }

    // 4. A-Z LIST
    function renderAZ() {
        renderFilterPage('title'); 
        document.getElementById('listTitle').innerText = 'A-Z MOVIE INDEX';
        const grid = document.getElementById('listGrid');
        grid.style.display = 'block';
        grid.innerHTML = '';
        
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(char => {
            const movies = videoData.filter(v => v.title.toUpperCase().startsWith(char));
            if(movies.length > 0) {
                let mLinks = movies.map(m => `<span onclick="loadPost('${m.id}')" style="cursor:pointer; display:block; padding:8px 0; color:#888; border-bottom:1px solid #111;">${m.title}</span>`).join("");
                grid.innerHTML += `<div style="background:#1c1c1c; padding:20px; margin-bottom:15px; border-radius:5px;"><h3 style="color:#fbb829; border-bottom:2px solid #333; padding-bottom:10px; margin-bottom:10px; font-size:20px;">${char}</h3>${mLinks}</div>`;
            }
        });
    }

    // 5. UTILITIES
    function goHome() {
        limit = 16;
        document.getElementById('homeView').style.display = 'block';
        document.getElementById('detailView').style.display = 'none';
        document.getElementById('listView').style.display = 'none';
        document.getElementById('sectionTitle').innerText = 'UPDATE TERBARU';
        document.getElementById('popularGrid').parentElement.style.display = 'block';
        renderHome();
    }

    function toggleNSFW() {
        isNSFW = !isNSFW;
        const btn = document.getElementById('nsfwBtn');
        btn.innerText = isNSFW ? 'NSFW MODE: ON' : 'SFW MODE: ON';
        btn.classList.toggle('active');
        renderHome();
    }

    function searchPosts() {
        const query = document.getElementById('s').value.toLowerCase();
        const filtered = videoData.filter(v => v.title.toLowerCase().includes(query) || v.code.toLowerCase().includes(query));
        renderGrid(filtered);
    }

    renderHome();
</script>
</body>
</html>
